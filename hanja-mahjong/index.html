<style>
/* Layout: a bright spring landscape behind a frosted glass table; controls on top, 3D tiles in the middle, study notes below. */
:root {
  --sky: #dff1fb;
  --meadow: #eef9ef;
  --glass: rgba(255, 255, 255, 0.58);
  --glass-line: rgba(39, 92, 78, 0.14);
  --text: #1e3b34;
  --muted: #5d7d74;
  --jade: #1d9a76;
  --jade-deep: #157a5d;
  --ivory: #fffaf0;
  --ivory-2: #f1e8d2;
  --ink: #1b1813;
  --eum: #d2402f;      /* 음 패 */
  --hun: #2d5bb8;      /* 뜻 패 */
  --gold: #f4b400;
  --path: #ff6a3d;
  --font-hanja: "한양해서", "HYhaeseo", "HYHaeSeo", "HY해서M", "HYhaeseoM", "LXGW WenKai TC", "Noto Serif KR", serif;
  --font-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--meadow); }
body { color: var(--text); font-family: var(--font-ui); font-size: 15px; min-height: 100%; }
.scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.wrap {
  position: relative; z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hz-font { font-family: var(--font-hanja); }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
h1 {
  margin: 0;
  font-weight: 900;
  font-size: clamp(28px, 5vw, 42px);
  line-height: 1;
  color: var(--text);
}
h1 .hz-font { font-weight: 700; margin-right: 4px; }
h1 small { font-weight: 500; font-size: 14px; color: var(--muted); margin-left: 10px; }
.rule { margin: 8px 0 0; color: var(--muted); font-size: 14px; max-width: 60ch; }
.rule b { color: var(--text); font-weight: 700; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.controls label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
select, button {
  font: inherit;
  font-size: 14px;
  color: var(--text);
  background: rgba(255,255,255,.85);
  border: 1px solid var(--glass-line);
  border-radius: 8px;
  padding: 7px 10px;
}
select:focus-visible, button:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
button { cursor: pointer; font-weight: 500; }
button:hover { border-color: var(--jade); }
button.primary { background: var(--jade); color: #fff; border-color: var(--jade-deep); font-weight: 700; box-shadow: 0 3px 0 var(--jade-deep); }
button.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--jade-deep); }
button:disabled { opacity: 0.45; cursor: default; }

.bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px;
  background: var(--glass);
  border: 1px solid var(--glass-line);
  border-radius: 12px;
  padding: 8px 14px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.stats { display: flex; gap: 22px; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; }
.stat span { font-size: 11px; letter-spacing: 0.06em; color: var(--muted); }
.stat strong { font-size: 20px; font-weight: 700; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.board-wrap {
  position: relative; width: 100%; display: flex; justify-content: center;
  background: var(--glass);
  border: 1px solid var(--glass-line);
  border-radius: 16px;
  padding: 14px 0 18px;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#board { position: relative; touch-action: manipulation; }
#path { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 5000; }
#path polyline { fill: none; stroke: var(--path); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px rgba(255,106,61,.6)); }

/* 입체 마작패: 상아색 앞면 + 크림색 두께 + 옥색 뒷판, 오른쪽 아래로 쌓인 그림자 */
.tile {
  position: absolute;
  padding: 0;
  border: none;
  border-radius: 6px;
  background: linear-gradient(145deg, #ffffff 0%, var(--ivory) 45%, var(--ivory-2) 100%);
  color: var(--ink);
  box-shadow:
    inset 0 1px 0 #fff,
    inset 0 -2px 3px rgba(150, 120, 60, .12),
    inset 0 0 0 1px rgba(170, 145, 90, .25),
    1px 1px 0 #efe4c7,
    2px 2px 0 #e6d8b4,
    3px 3px 0 #dccca2,
    4px 4px 0 #2aa883,
    5px 5px 0 #1f9474,
    6px 6px 0 #187a60,
    7px 9px 10px rgba(30, 60, 50, .35);
  display: grid; place-items: center;
  cursor: pointer;
  transition: transform .12s, box-shadow .12s, opacity .3s;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.tile:hover { transform: translate(-1px, -2px); }
.tile .face { line-height: 1; white-space: nowrap; }
.tile.h .face { font-family: var(--font-hanja); font-weight: 700; text-shadow: 0 1px 0 rgba(255,255,255,.9), 0 -1px 0 rgba(0,0,0,.08); }
.tile.e .face, .tile.m .face { font-family: var(--font-ui); font-weight: 700; letter-spacing: -0.02em; }
.tile.e .face { color: var(--eum); }
.tile.m .face { color: var(--hun); }
.tile .tag {
  position: absolute; top: 3px; left: 4px;
  font-family: var(--font-ui); line-height: 1; font-weight: 700;
}
.tile.e .tag { color: var(--eum); }
.tile.m .tag { color: var(--hun); }
.tile.sel {
  transform: translate(-2px, -6px);
  box-shadow:
    inset 0 1px 0 #fff,
    inset 0 0 0 2px var(--gold),
    0 0 0 3px var(--gold),
    1px 1px 0 #efe4c7, 2px 2px 0 #e6d8b4, 3px 3px 0 #dccca2,
    4px 4px 0 #2aa883, 5px 5px 0 #1f9474, 6px 6px 0 #187a60,
    10px 16px 16px rgba(30, 60, 50, .35);
}
.tile.under { pointer-events: none; }
.tile.locked { filter: brightness(.8) saturate(.65); cursor: not-allowed; }
.tile.locked:hover { transform: none; }
.tile.hint { animation: pulse 0.9s ease-in-out 3; }
.tile.bad { animation: shake .35s; }
.tile.gone { opacity: 0; transform: scale(.6) translateY(-10px); pointer-events: none; }
@keyframes pulse { 50% { filter: drop-shadow(0 0 8px var(--gold)) brightness(1.06); transform: translate(-1px, -4px); } }
@keyframes shake { 20%,60% { transform: translateX(-4px); } 40%,80% { transform: translateX(4px); } }

#toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: #fff; color: var(--text);
  border: 1px solid var(--glass-line);
  padding: 10px 16px; border-radius: 10px;
  font-size: 15px; box-shadow: 0 8px 24px rgba(30,60,50,.22);
  z-index: 900; max-width: calc(100% - 32px); text-align: center;
  transition: opacity .25s;
}
#toast .hz { font-family: var(--font-hanja); font-weight: 700; font-size: 22px; margin-right: 6px; vertical-align: -2px; }

#win {
  position: absolute; inset: -8px; z-index: 6000;
  display: grid; place-items: center;
  background: rgba(255,255,255,.7);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  border-radius: 12px;
}
#win .card { background: #fff; color: var(--text); padding: 26px 30px; border-radius: 14px; text-align: center; display: flex; flex-direction: column; gap: 10px; max-width: 90%; box-shadow: 0 12px 30px rgba(30,60,50,.25); }
#win h2 { margin: 0; font-family: var(--font-hanja); font-weight: 700; font-size: 44px; color: var(--jade-deep); }
#win p { margin: 0; font-variant-numeric: tabular-nums; }

section, details {
  background: var(--glass);
  border: 1px solid var(--glass-line);
  border-radius: 12px;
  padding: 12px 14px;
}
section h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: #fff; border: 1px solid var(--glass-line); border-radius: 8px; padding: 4px 9px; font-size: 13px; white-space: nowrap; }
.chip b { font-family: var(--font-hanja); font-weight: 700; font-size: 19px; margin-right: 4px; }
.empty { color: var(--muted); font-size: 13px; }

summary { cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 500; }
.dict { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.dict div { display: flex; align-items: baseline; gap: 6px; font-size: 13px; padding: 4px 6px; border-radius: 6px; background: rgba(255,255,255,.7); }
.dict b { font-family: var(--font-hanja); font-size: 22px; font-weight: 700; }
.dict h4 { grid-column: 1 / -1; margin: 8px 0 0; font-weight: 700; color: var(--jade-deep); font-size: 13px; }

@media (prefers-reduced-motion: reduce) {
  .tile, #path polyline { transition: none; }
  .tile.hint, .tile.bad { animation: none; }
  .tile.hint { outline: 3px solid var(--gold); }
}
</style>

<div class="wrap">
  <header>

  "72": "家 집 가,間 사이 간,江 강 강,車 수레 거,工 장인 공,空 빌 공,氣 기운 기,記 기록할 기,男 사내 남,內 안 내,農 농사 농,答 대답 답,道 길 도,動 움직일 동,力 힘 력,立 설 립,每 매양 매,名 이름 명,物 물건 물,方 모 방,不 아닐 불,事 일 사,上 윗 상,姓 성 성,世 인간 세,手 손 수,時 때 시,市 저자 시,食 밥 식,安 편안 안,午 낮 오,右 오른 우,子 아들 자,自 스스로 자,場 마당 장,電 번개 전,前 앞 전,全 온전 전,正 바를 정,足 발 족,左 왼 좌,直 곧을 직,平 평평할 평,下 아래 하,漢 한수 한,海 바다 해,話 말씀 화,活 살 활,孝 효도 효,後 뒤 후",
  "7": "歌 노래 가,口 입 구,旗 기 기,冬 겨울 동,洞 골 동,同 한가지 동,登 오를 등,來 올 래,老 늙을 로,里 마을 리,林 수풀 림,面 낯 면,命 목숨 명,問 물을 문,文 글월 문,百 일백 백,夫 지아비 부,算 셈 산,色 빛 색,夕 저녁 석,少 적을 소,所 바 소,數 셈 수,植 심을 식,心 마음 심,語 말씀 어,然 그럴 연,有 있을 유,育 기를 육,邑 고을 읍,入 들 입,字 글자 자,祖 할아비 조,住 살 주,主 주인 주,重 무거울 중,地 따 지,紙 종이 지,川 내 천,千 일천 천,天 하늘 천,草 풀 초,村 마을 촌,秋 가을 추,春 봄 춘,出 날 출,便 편할 편,夏 여름 하,花 꽃 화,休 쉴 휴"
};
const GRADE_NAME = { "8": "8급", "72": "7급Ⅱ", "7": "7급" };
const DATA = [];
const BY = {};
for (const g of ["8", "72", "7"]) {
  for (const item of RAW[g].split(",")) {
    const [c, hun, eum] = item.trim().split(" ");
    const d = { c, hun, eum, g };
    DATA.push(d); BY[c] = d;
  }
}
// [긴 변, 짧은 변]. 쌓기 판은 한 층 올라갈 때마다 사방으로 한 칸씩 줄어든다.
const FLAT_SIZES = { s: [8, 6], n: [10, 8], l: [12, 8] };
const STACK_SIZES = { s: [6, 6], n: [8, 6], l: [10, 6] };

// ── 상태 ──
// stack[r][c] = 아래층부터 쌓인 패 배열. 1층 판은 길이가 0 또는 1.
let R = 0, C = 0, layers = 1, stack = [], sel = null, score = 0, elapsed = 0, timer = null;
let hints = 5, shuffles = 3, lastMatch = 0, combo = 0, learned = [], busy = false, over = false;
const $ = id => document.getElementById(id);
const boardEl = $("board"), pathEl = $("path");
let cell = { w: 40, h: 52, m: 18, lift: 0 };
const DEPTH = 6; // 패 두께(그림자)만큼 비워 둔다

function pool(range) {
  if (range === "8") return DATA.filter(d => d.g === "8");
  if (range === "72") return DATA.filter(d => d.g !== "7");
  return DATA.slice();
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function partnerText(d, kind) { return kind === "e" ? d.eum : d.hun; }

// 같은 판에서 화면에 보이는 짝 패(음/뜻)는 모두 서로 달라야 헷갈리지 않는다.
function pickPairs(n, range, mode) {
  const used = new Set(), chosen = [];
  for (const d of shuffle(pool(range))) {
    if (chosen.length >= n) break;
    const kind = mode === "x" ? (Math.random() < 0.5 ? "e" : "m") : mode;
    const key = kind + partnerText(d, kind);
    if (used.has(key)) {
      if (mode !== "x") continue;
      const k2 = kind === "e" ? "m" : "e";
      const key2 = k2 + partnerText(d, k2);
      if (used.has(key2)) continue;
      used.add(key2); chosen.push({ d, kind: k2 }); continue;
    }
    used.add(key); chosen.push({ d, kind });
  }
  const pairs = chosen.slice();
  for (let i = 0; pairs.length < n; i++) pairs.push(chosen[i % chosen.length]); // 모자라면 같은 짝을 한 번 더
  let id = 0;
  return pairs.map(p => [{ id: id++, ch: p.d.c, kind: "h" }, { id: id++, ch: p.d.c, kind: p.kind }]);
}

// ── 판 구조 ──
function emptyStack() { return Array.from({ length: R + 2 }, () => Array.from({ length: C + 2 }, () => [])); }
function height(r, c) { return stack[r] && stack[r][c] ? stack[r][c].length : 0; }
function topOf(r, c) { const s = stack[r][c]; return s[s.length - 1]; }
function allTiles() {
  const out = [];
  for (let r = 1; r <= R; r++) for (let c = 1; c <= C; c++) for (const t of stack[r][c]) out.push(t);
  return out;
}
function findTile(id) { return allTiles().find(t => t.id === id); }
function isTop(t) { return topOf(t.r, t.c) === t; }
// 쌓기 판: 위가 비어 있고 왼쪽이나 오른쪽이 트여 있어야 고를 수 있다.
function isFree(t) {
  if (!isTop(t)) return false;
  if (layers === 1) return true;
  return height(t.r, t.c - 1) <= t.L || height(t.r, t.c + 1) <= t.L;
}
function positionsFor() {
  const out = [];
  for (let k = 0; k < layers; k++)
    for (let r = 1 + k; r <= R - k; r++)
      for (let c = 1 + k; c <= C - k; c++) out.push({ L: k, r, c });
  return out;
}
function pairUp(ts) {
  const g = {};
  for (const t of ts) (g[t.ch] ||= { h: [], p: [] })[t.kind === "h" ? "h" : "p"].push(t);
  const out = [];
  for (const k in g) g[k].h.forEach((h, i) => out.push([h, g[k].p[i]]));
  return out;
}
function placeRandom(positions, pairs) {
  const ts = shuffle(pairs.flat());
  return positions.map((p, i) => [ts[i], p]);
}
// 끝까지 풀 수 있는 배치: 꽉 찬 판에서 "지금 고를 수 있는 자리 두 곳"을 골라 짝을 놓고 지워 나간다.
// 이 순서를 그대로 따라 하면 판이 모두 비워지므로 언제나 풀린다.
function placeSolvable(positions, pairs) {
  const key = (r, c) => r * 100 + c;
  for (let attempt = 0; attempt < 300; attempt++) {
    const h = {};
    for (const p of positions) h[key(p.r, p.c)] = (h[key(p.r, p.c)] || 0) + 1;
    const H = (r, c) => h[key(r, c)] || 0;
    let rest = positions.slice();
    const plan = [];
    let ok = true;
    for (const pair of shuffle(pairs.slice())) {
      const free = rest.filter(p => H(p.r, p.c) === p.L + 1 && (H(p.r, p.c - 1) <= p.L || H(p.r, p.c + 1) <= p.L));
      if (free.length < 2) { ok = false; break; }
      shuffle(free);
      const [a, b] = free;
      const [x, y] = Math.random() < 0.5 ? pair : [pair[1], pair[0]];
      plan.push([x, a], [y, b]);
      rest = rest.filter(p => p !== a && p !== b);
      h[key(a.r, a.c)]--; h[key(b.r, b.c)]--;
    }
    if (ok) return plan;
  }
  return null;
}
function applyPlan(plan) {
  stack = emptyStack();
  plan.sort((x, y) => x[1].L - y[1].L);
  for (const [t, p] of plan) { t.L = p.L; t.r = p.r; t.c = p.c; stack[p.r][p.c].push(t); }
}
function arrange(positions, pairs) {
  if (layers === 1) applyPlan(placeRandom(positions, pairs));
  else applyPlan(placeSolvable(positions, pairs) || placeRandom(positions, pairs));
}

function newGame() {
  const range = $("range").value, mode = $("mode").value, size = $("size").value;
  layers = +$("layers").value;
  const [lg, sm] = (layers === 1 ? FLAT_SIZES : STACK_SIZES)[size];
  const portrait = $("boardWrap").clientWidth < 640;
  C = portrait ? sm : lg; R = portrait ? lg : sm;
  const positions = positionsFor();
  arrange(positions, pickPairs(positions.length / 2, range, mode));
  ensureMovable();
  sel = null; score = 0; elapsed = 0; hints = 5; shuffles = 3; combo = 0; lastMatch = 0; learned = []; over = false; busy = false;
  updateRule(); render(); renderLearned(); updateStats(); startTimer();
}

function startTimer() {
  clearInterval(timer);
  timer = setInterval(() => { if (!over && !document.hidden) { elapsed++; updateStats(); } }, 1000);
}

// ── 1층 판 경로 찾기: 빈 칸(바깥 테두리 포함)으로만, 꺾임 2번 이하 ──
const DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];
function findPath(a, b) {
  const H = R + 2, W = C + 2;
  const best = new Map();
  const q = [];
  const start = { r: a[0], c: a[1], p: null };
  for (let d = 0; d < 4; d++) q.push({ r: a[0], c: a[1], d, t: 0, p: start });
  for (let i = 0; i < q.length; i++) {
    const s = q[i];
    const nr = s.r + DR[s.d], nc = s.c + DC[s.d];
    if (nr < 0 || nc < 0 || nr >= H || nc >= W) continue;
    const node = { r: nr, c: nc, p: s };
    if (nr === b[0] && nc === b[1]) return corners(node);
    if (height(nr, nc)) continue;
    for (let nd = 0; nd < 4; nd++) {
      if (nd === (s.d + 2) % 4) continue;
      const nt = s.t + (nd !== s.d ? 1 : 0);
      if (nt > 2) continue;
      const key = (nr * W + nc) * 4 + nd;
      if (best.has(key) && best.get(key) <= nt) continue;
      best.set(key, nt);
      q.push({ r: nr, c: nc, d: nd, t: nt, p: node });
    }
  }
  return null;
}
function corners(node) {
  const pts = [];
  for (let x = node; x; x = x.p) {
    const l = pts[pts.length - 1];
    if (!l || l[0] !== x.r || l[1] !== x.c) pts.push([x.r, x.c]);
  }
  pts.reverse();
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const [a, b, c] = [pts[i - 1], pts[i], pts[i + 1]];
    if ((b[0] - a[0]) !== (c[0] - b[0]) || (b[1] - a[1]) !== (c[1] - b[1])) out.push(b);
  }
  out.push(pts[pts.length - 1]);
  return out;
}

function isPair(t1, t2) {
  return t1.ch === t2.ch && ((t1.kind === "h") !== (t2.kind === "h"));
}
function findMove() {
  const groups = {};
  for (const t of allTiles()) {
    if (!isFree(t)) continue;
    (groups[t.ch] ||= { h: [], p: [] })[t.kind === "h" ? "h" : "p"].push(t);
  }
  for (const k in groups) for (const a of groups[k].h) for (const b of groups[k].p) {
    if (layers > 1 || findPath([a.r, a.c], [b.r, b.c])) return [a, b];
  }
  return null;
}
function remaining() { return allTiles().length; }
function reshuffle() {
  const ts = allTiles();
  const positions = ts.map(t => ({ L: t.L, r: t.r, c: t.c }));
  arrange(positions, pairUp(ts));
}
function ensureMovable() {
  for (let i = 0; i < 200 && remaining() && !findMove(); i++) reshuffle();
}

// ── 그리기 ──
function layout() {
  const avail = $("boardWrap").clientWidth;
  const availH = Math.max(320, window.innerHeight - 200);
  const extra = (layers - 1) * 0.14;
  // 보드 폭 = C*w + 2m (m = 0.45w) + 층 높이만큼의 여백, 높이도 같은 방식 (h = 1.3w)
  let w = Math.min(58, avail / (C + 0.9 + extra), availH / (R * 1.3 + 0.9 + extra));
  w = Math.max(28, Math.floor(w));
  const lift = layers > 1 ? Math.max(4, Math.round(w * 0.14)) : 0;
  cell = { w, h: Math.round(w * 1.3), m: Math.round(w * 0.45), lift };
  const off = (layers - 1) * lift;
  boardEl.style.width = (C * cell.w + 2 * cell.m + off) + "px";
  boardEl.style.height = (R * cell.h + 2 * cell.m + off) + "px";
}
function off() { return (layers - 1) * cell.lift; }
function cx(c) { return off() + (c === 0 ? cell.m / 2 : c === C + 1 ? cell.m * 1.5 + C * cell.w : cell.m + (c - 1) * cell.w + cell.w / 2); }
function cy(r) { return off() + (r === 0 ? cell.m / 2 : r === R + 1 ? cell.m * 1.5 + R * cell.h : cell.m + (r - 1) * cell.h + cell.h / 2); }

function render() {
  layout();
  boardEl.querySelectorAll(".tile, #win").forEach(e => e.remove());
  pathEl.innerHTML = "";
  for (const t of allTiles()) boardEl.appendChild(makeTile(t));
  updateLocks();
}
function makeTile(t) {
  const d = BY[t.ch];
  const el = document.createElement("button");
  el.className = "tile " + t.kind;
  el.dataset.id = t.id;
  Object.assign(el.style, {
    left: (off() + cell.m + (t.c - 1) * cell.w - DEPTH / 2 - t.L * cell.lift) + "px",
    top: (off() + cell.m + (t.r - 1) * cell.h - DEPTH / 2 - t.L * cell.lift) + "px",
    width: (cell.w - DEPTH) + "px",
    height: (cell.h - DEPTH) + "px",
    zIndex: t.L * 1000 + t.r * 50 + t.c,
  });
  const face = document.createElement("span");
  face.className = "face";
  if (t.kind === "h") {
    face.textContent = t.ch;
    face.style.fontSize = Math.round(cell.w * 0.7) + "px";
    el.setAttribute("aria-label", "한자 " + t.ch);
  } else {
    const txt = partnerText(d, t.kind);
    face.textContent = txt;
    const len = [...txt].length;
    face.style.fontSize = Math.round(cell.w * (len <= 1 ? 0.48 : len === 2 ? 0.36 : len === 3 ? 0.26 : 0.2)) + "px";
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = t.kind === "e" ? "음" : "뜻";
    tag.style.fontSize = Math.max(8, Math.round(cell.w * 0.18)) + "px";
    el.appendChild(tag);
    el.setAttribute("aria-label", (t.kind === "e" ? "음 " : "뜻 ") + txt);
  }
  el.appendChild(face);
  el.addEventListener("click", () => onTile(t.id));
  return el;
}
function tileEl(id) { return boardEl.querySelector('.tile[data-id="' + id + '"]'); }
function updateLocks() {
  for (const t of allTiles()) {
    const el = tileEl(t.id); if (!el) continue;
    const top = isTop(t);
    el.classList.toggle("under", !top);
    el.classList.toggle("locked", top && !isFree(t));
    el.tabIndex = top ? 0 : -1;
  }
}
function center(t) {
  const el = tileEl(t.id);
  return [el.offsetLeft + el.offsetWidth / 2, el.offsetTop + el.offsetHeight / 2];
}

// ── 조작 ──
function shake(id) { const e = tileEl(id); e.classList.remove("bad"); void e.offsetWidth; e.classList.add("bad"); }
function onTile(id) {
  if (busy || over) return;
  const t = findTile(id); if (!t) return;
  clearHints();
  if (!isFree(t)) {
    shake(id);
    toast("아직 막힌 패예요. 위에 패가 없고 왼쪽이나 오른쪽이 트인 밝은 패만 고를 수 있어요.");
    return;
  }
  if (sel == null) { select(id); return; }
  if (sel === id) { deselect(); return; }
  const t0 = findTile(sel);
  if ((t0.kind === "h") === (t.kind === "h")) { deselect(); select(id); return; } // 같은 종류끼리는 선택만 옮김
  const hz = t0.kind === "h" ? t0 : t;
  const d = BY[hz.ch];
  if (!isPair(t0, t)) {
    combo = 0;
    shake(sel); shake(id);
    toast(`<span class="hz">${d.c}</span>은(는) <b>${d.hun} ${d.eum}</b> — 짝이 아니에요`);
    deselect();
    return;
  }
  let pts;
  if (layers === 1) {
    const path = findPath([t0.r, t0.c], [t.r, t.c]);
    if (!path) {
      toast("짝은 맞지만 길이 막혔어요. 꺾임 두 번 이하로 이어져야 해요.");
      deselect(); select(id);
      return;
    }
    pts = path.map(([r, c]) => [cx(c), cy(r)]);
  } else {
    pts = [center(t0), center(t)];
  }
  // 성공
  drawPath(pts);
  const now = Date.now();
  combo = now - lastMatch < 4000 ? combo + 1 : 0;
  lastMatch = now;
  score += 100 + combo * 50;
  [sel, id].forEach(x => tileEl(x).classList.add("gone"));
  stack[t0.r][t0.c].pop(); stack[t.r][t.c].pop();
  sel = null;
  if (!learned.includes(d.c)) learned.push(d.c);
  renderLearned();
  toast(`<span class="hz">${d.c}</span><b>${d.hun} ${d.eum}</b>${combo ? ` · 연속 ${combo + 1}번!` : ""}`);
  updateStats();
  busy = true;
  setTimeout(() => {
    busy = false;
    pathEl.innerHTML = "";
    boardEl.querySelectorAll(".tile.gone").forEach(e => e.remove());
    updateLocks();
    if (!remaining()) return win();
    if (!findMove()) {
      ensureMovable(); render();
      toast("고를 수 있는 짝이 없어서 남은 패를 섞었어요.");
    }
  }, 380);
}
function select(id) { sel = id; tileEl(id).classList.add("sel"); }
function deselect() { if (sel != null) { const e = tileEl(sel); if (e) e.classList.remove("sel"); } sel = null; }
function clearHints() { boardEl.querySelectorAll(".tile.hint").forEach(e => e.classList.remove("hint")); }

function drawPath(pts) {
  pathEl.setAttribute("width", boardEl.style.width);
  pathEl.setAttribute("height", boardEl.style.height);
  pathEl.innerHTML = `<polyline points="${pts.map(p => p.join(",")).join(" ")}"></polyline>`;
}

function useHint() {
  if (busy || over || hints <= 0) return;
  const mv = findMove(); if (!mv) return;
  hints--; score = Math.max(0, score - 50);
  clearHints(); deselect();
  mv.forEach(t => tileEl(t.id).classList.add("hint"));
  updateStats();
}
function useShuffle() {
  if (busy || over || shuffles <= 0) return;
  shuffles--; score = Math.max(0, score - 100);
  sel = null; reshuffle(); ensureMovable(); render(); updateStats();
}

function win() {
  over = true; clearInterval(timer);
  const box = document.createElement("div");
  box.id = "win";
  box.innerHTML = `<div class="card"><h2>完成</h2><p>${fmt(elapsed)} 만에 ${learned.length}자를 모두 맞췄어요.</p><p>점수 <b>${score}</b></p><button class="primary" type="button">한 판 더</button></div>`;
  box.querySelector("button").addEventListener("click", newGame);
  boardEl.appendChild(box);
}

// ── 표시 ──
function updateRule() {
  $("rule").innerHTML = layers === 1
    ? "한자 패와 그 한자의 <b>음</b> 패 또는 <b>뜻</b> 패를 차례로 누르세요. 두 패를 잇는 선이 두 번 이하로 꺾이면 짝이 사라집니다."
    : `패가 <b>${layers}층</b>으로 쌓여 있어요. 한자 패와 그 한자의 <b>음</b>·<b>뜻</b> 패를 차례로 누르세요. 위에 패가 없고 왼쪽이나 오른쪽이 트인 <b>밝은 패</b>만 고를 수 있어요.`;
}
function fmt(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function updateStats() {
  $("left").textContent = remaining() / 2;
  $("time").textContent = fmt(elapsed);
  $("score").textContent = score;
  $("hintN").textContent = hints; $("shufN").textContent = shuffles;
  $("hintBtn").disabled = hints <= 0; $("shufBtn").disabled = shuffles <= 0;
}
function renderLearned() {
  const box = $("learned");
  if (!learned.length) { box.innerHTML = '<span class="empty">짝을 맞추면 여기에 한자와 훈음이 쌓입니다.</span>'; return; }
  box.innerHTML = learned.map(c => `<span class="chip"><b>${c}</b>${BY[c].hun} ${BY[c].eum}</span>`).join("");
}
function renderDict() {
  $("dict").innerHTML = ["8", "72", "7"].map(g =>
    `<h4>${GRADE_NAME[g]} · ${DATA.filter(d => d.g === g).length}자</h4>` +
    DATA.filter(d => d.g === g).map(d => `<div><b>${d.c}</b>${d.hun} ${d.eum}</div>`).join("")
  ).join("");
}
let toastT = null;
function toast(html) {
  const t = $("toast");
  t.innerHTML = html; t.hidden = false; t.style.opacity = 1;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.hidden = true, 260); }, 2200);
}

$("newBtn").addEventListener("click", newGame);
$("hintBtn").addEventListener("click", useHint);
$("shufBtn").addEventListener("click", useShuffle);
["range", "mode", "size", "layers"].forEach(id => $(id).addEventListener("change", newGame));
let rz = null;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const s = sel; render(); if (s != null && tileEl(s)) select(s); if (over) win(); }, 150); });

// 뷰어 업데이트 때 진행 중인 판을 유지
function snapshot() { return { v: 3, layers, R, C, stack, score, elapsed, hints, shuffles, learned, over }; }
function start(data) {
  renderDict();
  if (data && data.v === 3 && data.stack) {
    ({ layers, R, C, stack, score, elapsed, hints, shuffles, learned } = data);
    $("layers").value = String(layers);
    over = false; sel = null;
    updateRule(); render(); renderLearned(); updateStats(); startTimer();
    if (data.over) win();
  } else newGame();
}
window.claude?.hot?.snapshot?.(snapshot);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
